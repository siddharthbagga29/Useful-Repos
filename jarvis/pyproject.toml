[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "Siddharth Bagga's assistant: a read-only public Q&A service and a local, confirmation-gated owner agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.11,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
voice = [
  "openwakeword>=0.6",
  "pyaudio>=0.2.14",
  "faster-whisper>=1.0",
  "numpy>=1.26",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-jsonschema",
]

[project.scripts]
jarvis-public = "jarvis.public.app:main"
jarvis-owner = "jarvis.owner.cli:main"
jarvis-eval = "jarvis.eval.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S603",  # subprocess without shell=True is the safe form we use deliberately
  "S607",  # osascript/open/say are resolved from PATH on macOS by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# AppleScript source cannot be re-wrapped to a Python line length.
"src/jarvis/owner/mac.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["jarvis"]

[[tool.mypy.overrides]]
module = ["openwakeword", "openwakeword.*", "pyaudio", "faster_whisper", "numpy"]
ignore_missing_imports = true
