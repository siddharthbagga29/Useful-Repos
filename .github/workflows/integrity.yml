# Repository integrity: fails if any tracked file contains code that could run without anyone choosing
# to run it (editor auto-run tasks, code disguised as fonts or images, code hidden after whitespace,
# install hooks), or an action not pinned to a commit SHA. Reads files only; never executes repository content. See tools/repo-integrity.mjs.
name: integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: node tools/repo-integrity.mjs
      - run: node tools/check-actions.mjs
