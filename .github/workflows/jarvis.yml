name: jarvis

on:
  push:
    paths: ["jarvis/**", ".github/workflows/jarvis.yml"]
  pull_request:
    paths: ["jarvis/**", ".github/workflows/jarvis.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: jarvis/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest
      - run: jarvis-eval --backend fake --min-pass-rate 0
